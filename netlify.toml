[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/story.html"
  to = "/story/"
  status = 301
[[redirects]]
  from = "/menu.html"
  to = "/menu/"
  status = 301
[[redirects]]
  from = "/gallery.html"
  to = "/gallery/"
  status = 301
[[redirects]]
  from = "/visit.html"
  to = "/visit/"
  status = 301
